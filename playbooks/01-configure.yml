- name: Prepare all Kubernetes control-plane VMs
  hosts: control_plane
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Configure node name resolution
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE KUBERNETES NODES"
        block: |
          {% for node in cluster_nodes %}
          {{ node.ip }} {{ node.name }}
          {% endfor %}

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: true

    - name: Disable swap permanently in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\n]+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'
        backup: true

    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Load kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load overlay module now
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load bridge netfilter module now
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Configure Kubernetes networking sysctl
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
      notify: Apply sysctl

    - name: Create containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check existing containerd configuration
      ansible.builtin.stat:
        path: /etc/containerd/config.toml
      register: containerd_config

    - name: Generate default containerd configuration
      ansible.builtin.shell: |
        containerd config default > /etc/containerd/config.toml
      args:
        executable: /bin/bash
      when: not containerd_config.stat.exists

    - name: Configure systemd cgroup driver
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started

    - name: Flush handlers before verification
      ansible.builtin.meta: flush_handlers

    - name: Verify hostname and containerd
      ansible.builtin.command: "{{ item }}"
      loop:
        - hostname
        - containerd --version
        - systemctl is-active containerd
      register: verification
      changed_when: false

    - name: Display verification results
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ item.stdout }}"
      loop: "{{ verification.results }}"

  handlers:
    - name: Apply sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
