
---
- name: Install Kubernetes packages
  hosts: control_plane
  become: true
  gather_facts: true

  vars:
    kubernetes_minor: "v1.37"

  tasks:
    - name: Create APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key
        dest: /tmp/kubernetes-release.key
        mode: "0644"

    - name: Install Kubernetes repository signing key
      ansible.builtin.command:
        cmd: >-
          gpg --dearmor --yes
          -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          /tmp/kubernetes-release.key
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
          https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/ /
        filename: kubernetes
        state: present
        update_cache: true

    - name: Install kubelet kubeadm and kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

    - name: Verify installed Kubernetes versions
      ansible.builtin.command: "{{ item }}"
      loop:
        - kubeadm version -o short
        - kubelet --version
        - kubectl version --client
      register: version_checks
      changed_when: false

    - name: Show installed versions
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ item.stdout }}"
      loop: "{{ version_checks.results }}"
